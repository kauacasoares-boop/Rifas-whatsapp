<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3;url=https://chat.whatsapp.com/Bp7IUu5mNpEIemVJHBOUSB?s=cl&amp;p=i&amp;mlu=4&amp;ilr=4&amp;iam=2">
  <title>Entrando no grupo de rifas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f3f7f4; color: #173b2a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 420px); text-align: center; background: white;
      padding: 32px 24px; border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    .icon { font-size: 42px; margin-bottom: 12px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { line-height: 1.5; color: #52645a; margin: 0 0 22px; }
    .loader {
      width: 34px; height: 34px; margin: 0 auto 20px;
      border: 4px solid #d9e8de; border-top-color: #16834b;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    a {
      display: inline-block; padding: 12px 18px; border-radius: 10px;
      background: #16834b; color: white; text-decoration: none; font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🎟️</div>
    <h1>Preparando seu acesso!</h1>
    <p>Você será direcionado ao grupo de rifas no WhatsApp em alguns segundos.</p>
    <div class="loader" aria-hidden="true"></div>
    <p>Se não for redirecionado automaticamente, toque no botão abaixo.</p>
    <a href="https://chat.whatsapp.com/Bp7IUu5mNpEIemVJHBOUSB?s=cl&amp;p=i&amp;mlu=4&amp;ilr=4&amp;iam=2">Entrar no grupo do WhatsApp</a>
  </main>
</body>
</html>
